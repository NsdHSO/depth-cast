[package]
name = "pico-firmware"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pico-firmware"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[features]
firmware = []

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "0.2"
panic-halt = "0.2"
rp-pico = "0.8"
rtt-target = "0.6"
