name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Build release
        run: cargo pico-build

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Append contributors list
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CONTRIBUTORS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/contributors \
            --jq '[.[] | "- \(.login) (\(.contributions) commits)"] | join("\n")')

          NOTES_FILE=$(mktemp)
          gh release view ${{ github.ref_name }} --json body -q .body > "$NOTES_FILE"
          printf '\n\n## Contributors\n\n%s\n' "$CONTRIBUTORS" >> "$NOTES_FILE"

          gh release edit ${{ github.ref_name }} --notes-file "$NOTES_FILE"
          rm -f "$NOTES_FILE"

      - name: Upload Pico firmware ELF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: target/thumbv6m-none-eabi/release/pico-firmware
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
